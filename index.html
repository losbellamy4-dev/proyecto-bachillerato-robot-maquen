<script>
'use strict';
/* =======================================================================
   SEGURIDAD VIAL CON MICRO:BIT — App controladora (Web Bluetooth)
   Estructura:
     1. Configuración y utilidades
     2. Preferencias (tema, color, vibración)
     3. Vibración háptica
     4. Avisos (toasts)
     5. Fondo con parallax
     6. Bluetooth: clase MicrobitUART  ← el corazón de la app
     7. Intro animada
     8. Diálogo de bienvenida / ajustes
     9. Guía paso a paso
    10. Controles del coche
    11. Arranque
   ======================================================================= */

/* ========== 1. CONFIGURACIÓN Y UTILIDADES ========== */

// UUIDs del servicio UART (Nordic UART Service) que usa el micro:bit.
const UART = {
  SERVICE: '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
  CHAR_02: '6e400002-b5a3-f393-e0a9-e50e24dcca9e',
  CHAR_03: '6e400003-b5a3-f393-e0a9-e50e24dcca9e',
};
// Nombre con el que se anuncia el micro:bit: "BBC micro:bit [xxxxx]"
const NAME_PREFIX = 'BBC micro:bit';

// Comandos EXACTOS que espera el micro:bit (minúsculas, sin acentos).
const MOVE_CMDS = new Set(['avanzar', 'atras', 'izquierda', 'derecha', 'parar']);

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);           // progreso 0..1 de un tramo de tiempo
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const easeInOut = p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rootEl = document.documentElement;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lowEnd = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3;
const EASE = 'cubic-bezier(.22, 1, .36, 1)';

// Rechaza una promesa si tarda demasiado (para que la app nunca se quede colgada).
function withTimeout(promise, ms) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(Object.assign(new Error('timeout'), { name: 'TimeoutError' })), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

/* ========== 2. PREFERENCIAS ========== */
const Prefs = {
  KEY: 'sv-prefs-v1',
  data: { theme: 'dark', accent: 'green', haptics: true },
  load() {
    try {
      const saved = JSON.parse(localStorage.getItem(this.KEY) || '{}');
      if (saved.theme === 'light' || saved.theme === 'dark') this.data.theme = saved.theme;
      if (['green', 'cyan', 'violet'].includes(saved.accent)) this.data.accent = saved.accent;
      if (typeof saved.haptics === 'boolean') this.data.haptics = saved.haptics;
    } catch (e) { /* almacenamiento bloqueado: valores por defecto */ }
    return this;
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { /* sin persistencia */ } },
  apply() {
    rootEl.dataset.theme = this.data.theme;
    rootEl.dataset.accent = this.data.accent;
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.content = this.data.theme === 'light' ? '#edf1f6' : '#060a11';
  },
  set(key, value) {
    if (this.data[key] === value) return;
    this.data[key] = value;
    this.save();
    // Si el navegador lo permite, fundido suave de toda la página al cambiar de tema/color.
    if (document.startViewTransition && !reduceMotion && key !== 'haptics') {
      try { document.startViewTransition(() => this.apply()); return; } catch (e) { /* sigue abajo */ }
    }
    this.apply();
  },
};

/* ========== 3. VIBRACIÓN HÁPTICA ========== */
const Haptics = {
  pulse(pattern) {
    if (!Prefs.data.haptics || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* no disponible */ }
  },
};

/* ========== 4. AVISOS (toasts) — nunca alert() ========== */
const Toast = (() => {
  const box = $('#toasts');
  const ICON = { info: 'i-info', ok: 'i-check', warn: 'i-alert', error: 'i-alert' };
  function show({ type = 'info', title, text = '', action = null, duration } = {}) {
    const el = document.createElement('div');
    el.className = `toast t-${type}`;
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.innerHTML = `<span class="toast-ic"><svg class="ic"><use href="#${ICON[type] || 'i-info'}"/></svg></span><div class="toast-body"><b></b><span></span></div>`;
    el.querySelector('b').textContent = title;
    el.querySelector('.toast-body span').textContent = text;
    if (!text) el.querySelector('.toast-body span').remove();
    let timer;
    const close = () => {
      clearTimeout(timer);
      if (el.classList.contains('out')) return;
      el.classList.add('out');
      setTimeout(() => el.remove(), 450);
    };
    if (action) {
      const b = document.createElement('button');
      b.className = 'toast-act';
      b.textContent = action.label;
      b.addEventListener('click', e => { e.stopPropagation(); close(); action.run(); });
      el.append(b);
    }
    el.addEventListener('click', close);
    // Como mucho 2 avisos a la vez: elegante, no saturado.
    const live = $$('.toast:not(.out)', box);
    if (live.length >= 2) { live[0].classList.add('out'); setTimeout(() => live[0].remove(), 450); }
    box.append(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    timer = setTimeout(close, duration ?? (type === 'error' ? 6500 : action ? 6000 : 3400));
    return { close };
  }
  return { show };
})();

/* ========== 5. FONDO CON PARALLAX (giroscopio o dedo) ========== */
const Parallax = (() => {
  const grid = $('.bg-grid'), depth = $('.bg-depth');
  const s = { x: 0, y: 0, tx: 0, ty: 0, running: false, base: null };
  function step() {
    // Interpolación suave (lerp) hacia el objetivo: movimiento fluido y sin tirones.
    s.x += (s.tx - s.x) * .07;
    s.y += (s.ty - s.y) * .07;
    grid.style.transform = `translate3d(${(-s.x * 10).toFixed(2)}px, ${(-s.y * 10).toFixed(2)}px, 0)`;
    depth.style.transform = `translate3d(${(-s.x * 26).toFixed(2)}px, ${(-s.y * 26).toFixed(2)}px, 0)`;
    // El bucle se detiene solo cuando llega al destino (ahorra batería).
    if (Math.abs(s.tx - s.x) + Math.abs(s.ty - s.y) > .002) requestAnimationFrame(step);
    else s.running = false;
  }
  function target(nx, ny) {
    s.tx = clamp(nx, -1, 1);
    s.ty = clamp(ny, -1, 1);
    if (!s.running) { s.running = true; requestAnimationFrame(step); }
  }
  function init() {
    if (reduceMotion) return;
    addEventListener('pointermove', e => target(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1), { passive: true });
    if (!lowEnd && 'DeviceOrientationEvent' in window) {
      addEventListener('deviceorientation', e => {
        if (e.gamma == null || e.beta == null) return;
        if (!s.base) s.base = { b: e.beta, g: e.gamma };
        // La posición "neutra" se adapta poco a poco a cómo sujetas el móvil.
        s.base.b += (e.beta - s.base.b) * .004;
        s.base.g += (e.gamma - s.base.g) * .004;
        const nx = (e.gamma - s.base.g) / 22, ny = (e.beta - s.base.b) / 22;
        if (Math.abs(nx - s.tx) + Math.abs(ny - s.ty) < .02) return;   // ignora el temblor
        target(nx, ny);
      }, { passive: true });
    }
  }
  return { init, get x() { return s.x; }, get y() { return s.y; } };
})();

/* =======================================================================
   6. BLUETOOTH — clase MicrobitUART
   -----------------------------------------------------------------------
   ¿Cómo hablamos con el micro:bit?
   - El micro:bit ofrece el servicio "UART" (como un cable serie, pero por
     Bluetooth Low Energy). Tiene dos "características" (canales):
       · una para ESCRIBIR (móvil → micro:bit)
       · otra para RECIBIR avisos (micro:bit → móvil)
   - ¡OJO! En el micro:bit los nombres van al revés que en el estándar de Nordic:
       6e400002 = TX del micro:bit (indicate → nos llega a nosotros)
       6e400003 = RX del micro:bit (write   → aquí escribimos)
     Para que funcione siempre, NO lo damos por supuesto: pedimos las dos y
     elegimos según sus propiedades (la que admite "write" es la de envío).
   - Cada comando se manda como texto UTF-8 terminado en "\n", porque el
     micro:bit lee hasta el salto de línea.
   - Los envíos van en una COLA (uno detrás de otro): el Bluetooth no admite
     dos escrituras a la vez ("GATT operation already in progress").
   ======================================================================= */
class MicrobitUART {
  constructor(handlers = {}) {
    this.h = handlers;              // onStatus(estado, info), onSent(cmd), onReceive(texto), onSendError(cmd, e)
    this.device = null;
    this.writeChar = null;          // característica donde escribimos
    this.notifyChar = null;         // característica de la que recibimos
    this.state = 'disconnected';    // 'disconnected' | 'connecting' | 'connected'
    this.queue = [];
    this.pumping = null;
    this.userClosing = false;
    this.busyOpening = false;
    this.encoder = new TextEncoder();
    this.decoder = new TextDecoder();
    this.rxBuffer = '';
    this._onDisc = this._onDisconnected.bind(this);
    this._onData = this._onNotify.bind(this);
  }

  get connected() { return this.state === 'connected' && !!(this.device && this.device.gatt && this.device.gatt.connected); }

  _set(state, info = {}) {
    this.state = state;
    try { this.h.onStatus && this.h.onStatus(state, { name: this.device && this.device.name, ...info }); }
    catch (e) { console.error(e); }
  }

  /* --- Conectar: abre el selector de dispositivos del navegador --- */
  async connect() {
    if (this.state !== 'disconnected') return;
    this.userClosing = false;
    this._set('connecting', { phase: 'search' });
    let device;
    try {
      // Filtramos por el prefijo del nombre y pedimos permiso para el servicio UART.
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: NAME_PREFIX }],
        optionalServices: [UART.SERVICE],
      });
    } catch (e) {
      this._set('disconnected', { reason: 'error' });
      throw e;
    }
    if (this.device && this.device !== device) this.device.removeEventListener('gattserverdisconnected', this._onDisc);
    this.device = device;
    device.removeEventListener('gattserverdisconnected', this._onDisc);
    device.addEventListener('gattserverdisconnected', this._onDisc);
    await this._open();
  }

  /* --- Reconectar al mismo micro:bit sin volver a abrir el selector --- */
  async reconnect() {
    if (!this.device) return this.connect();
    if (this.state !== 'disconnected') return;
    this.userClosing = false;
    await this._open();
  }

  async _open() {
    this._set('connecting', { phase: 'gatt' });
    this.busyOpening = true;
    try {
      await this._setupGatt();
      this.busyOpening = false;
      this._set('connected');
    } catch (e) {
      this.busyOpening = false;
      try { if (this.device && this.device.gatt.connected) this.device.gatt.disconnect(); } catch (_) { /* nada */ }
      this._cleanup();
      this._set('disconnected', { reason: 'error' });
      throw e;
    }
  }

  async _setupGatt() {
    // 1) Conectar con el servidor GATT del micro:bit (máx. 12 s).
    const server = await withTimeout(this.device.gatt.connect(), 12000);
    if (this.userClosing) throw Object.assign(new Error('cancelado'), { name: 'AbortError' });

    // 2) Obtener el servicio UART. Algunos Android tardan en "descubrir" servicios: 1 reintento.
    let service;
    for (let i = 0; i < 2; i++) {
      try { service = await server.getPrimaryService(UART.SERVICE); break; }
      catch (e) { if (i === 1 || !this.device.gatt.connected) throw e; await sleep(500); }
    }

    // 3) Pedir las dos características y elegir cada una por sus PROPIEDADES.
    const chars = [];
    for (const uuid of [UART.CHAR_02, UART.CHAR_03]) {
      try { chars.push(await service.getCharacteristic(uuid)); } catch (e) { /* puede no existir */ }
    }
    const canWrite = c => c.properties.write || c.properties.writeWithoutResponse;
    const canNotify = c => c.properties.notify || c.properties.indicate;
    this.writeChar = chars.find(c => canWrite(c) && !canNotify(c)) || chars.find(canWrite) || null;
    this.notifyChar = chars.find(c => c !== this.writeChar && canNotify(c)) || null;
    if (!this.writeChar) throw Object.assign(new Error('El servicio UART no tiene canal de escritura'), { name: 'NoUartWrite' });
    console.info('[BLE] Escribiendo en', this.writeChar.uuid, '| Recibiendo de', this.notifyChar ? this.notifyChar.uuid : '(ninguna)');

    // 4) Activar la recepción de mensajes del micro:bit (opcional: si falla, seguimos).
    if (this.notifyChar) {
      try {
        await this.notifyChar.startNotifications();
        this.notifyChar.addEventListener('characteristicvaluechanged', this._onData);
      } catch (e) {
        console.warn('[BLE] Sin notificaciones del micro:bit:', e);
        this.notifyChar = null;
      }
    }
  }

  /* --- Desconexión pedida por el usuario: primero "parar", por seguridad --- */
  async disconnect() {
    this.userClosing = true;
    if (this.connected) {
      this.queue = [];
      this.send('parar');
      try { await withTimeout(this.pumping || Promise.resolve(), 900); } catch (e) { /* da igual */ }
    }
    try { if (this.device && this.device.gatt.connected) this.device.gatt.disconnect(); } catch (e) { /* nada */ }
    this._cleanup();
    if (this.state !== 'disconnected') this._set('disconnected', { reason: 'user' });
  }

  /* --- El micro:bit se ha desconectado (lejos, sin batería, reinicio...) --- */
  _onDisconnected() {
    if (this.busyOpening) return;                       // lo gestiona _open()
    const wasConnected = this.state === 'connected';
    this._cleanup();
    if (this.userClosing || !wasConnected) {
      if (this.state !== 'disconnected') this._set('disconnected', { reason: 'user' });
      return;
    }
    this._autoReconnect();
  }

  // Hasta 2 reintentos automáticos antes de rendirse.
  async _autoReconnect() {
    const delays = [600, 1600];
    for (let i = 0; i < delays.length && !this.userClosing; i++) {
      this._set('connecting', { phase: 'reconnect', attempt: i + 1 });
      await sleep(delays[i]);
      if (this.userClosing) break;                        // el usuario canceló
      this.busyOpening = true;
      try {
        await this._setupGatt();
        this.busyOpening = false;
        if (this.userClosing) { try { this.device.gatt.disconnect(); } catch (e) { /* nada */ } break; }
        this._set('connected', { reconnected: true });
        return;
      } catch (e) {
        this.busyOpening = false;
        try { if (this.device.gatt.connected) this.device.gatt.disconnect(); } catch (_) { /* nada */ }
        this._cleanup();
      }
    }
    if (this.state !== 'disconnected') this._set('disconnected', { reason: this.userClosing ? 'user' : 'lost' });
  }

  _cleanup() {
    if (this.notifyChar) {
      try { this.notifyChar.removeEventListener('characteristicvaluechanged', this._onData); } catch (e) { /* nada */ }
    }
    this.writeChar = null;
    this.notifyChar = null;
    this.queue = [];
    this.rxBuffer = '';
  }

  /* --- Enviar un comando (se encola). Devuelve false si no hay conexión. ---
     Para que el coche responda al instante aunque pulses muy rápido:
       · si hay varios "velXX" pendientes, solo se manda el último;
       · si hay varios movimientos pendientes, solo el último (así "parar" siempre llega);
       · bocina/luces/seguridad nunca se descartan. */
  send(cmd) {
    if (!this.connected) return false;
    const kind = cmd.startsWith('vel') ? 'vel' : MOVE_CMDS.has(cmd) ? 'move' : 'extra';
    if (kind !== 'extra') this.queue = this.queue.filter(q => q.kind !== kind);
    this.queue.push({ cmd, kind });
    this._kick();
    return true;
  }

  _kick() {
    if (this.pumping) return;
    this.pumping = this._pump().finally(() => {
      this.pumping = null;
      if (this.queue.length && this.connected) this._kick();
    });
  }

  async _pump() {
    while (this.queue.length) {
      if (!this.connected) { this.queue = []; break; }
      const { cmd } = this.queue.shift();
      try {
        await this._writeLine(cmd);
        this.h.onSent && this.h.onSent(cmd);
      } catch (e) {
        // Un reintento rápido por si el canal estaba ocupado un instante.
        let ok = false;
        if (this.connected) {
          try { await sleep(40); await this._writeLine(cmd); ok = true; this.h.onSent && this.h.onSent(cmd); } catch (e2) { /* falla de nuevo */ }
        }
        if (!ok) { console.warn('[BLE] No se pudo enviar', cmd, e); this.h.onSendError && this.h.onSendError(cmd, e); }
      }
    }
  }

  // Escribe "texto\n" en UTF-8, en trozos de 20 bytes (límite clásico de BLE).
  async _writeLine(text) {
    const c = this.writeChar;
    if (!c) throw new Error('Sin canal de escritura');
    const data = this.encoder.encode(text + '\n');
    for (let i = 0; i < data.length; i += 20) {
      const chunk = data.slice(i, i + 20);
      if (c.properties.write && c.writeValueWithResponse) await c.writeValueWithResponse(chunk);
      else if (c.properties.writeWithoutResponse && c.writeValueWithoutResponse) await c.writeValueWithoutResponse(chunk);
      else await c.writeValue(chunk);
    }
  }

  // Mensajes del micro:bit → los juntamos por líneas.
  _onNotify(ev) {
    const v = ev.target.value;
    this.rxBuffer += this.decoder.decode(new Uint8Array(v.buffer, v.byteOffset, v.byteLength), { stream: true });
    let idx;
    while ((idx = this.rxBuffer.search(/[\r\n]/)) >= 0) {
      const line = this.rxBuffer.slice(0, idx).trim();
      this.rxBuffer = this.rxBuffer.slice(idx + 1);
      if (line && this.h.onReceive) this.h.onReceive(line);
    }
    clearTimeout(this.rxTimer);
    if (this.rxBuffer) {
      this.rxTimer = setTimeout(() => {
        const line = this.rxBuffer.trim();
        this.rxBuffer = '';
        if (line && this.h.onReceive) this.h.onReceive(line);
      }, 250);
    }
  }
}

// Traduce los errores técnicos de Web Bluetooth a mensajes claros.
function explainBleError(e) {
  const name = (e && e.name) || '';
  const msg = String((e && e.message) || '');
  if (name === 'NotFoundError' && /cancel/i.test(msg)) return { type: 'info', title: 'Búsqueda cancelada', text: 'Cuando quieras, vuelve a pulsar Conectar.' };
  if (name === 'NotFoundError' && /(adapter|not available|unavailable|turned off)/i.test(msg)) return { type: 'warn', title: 'Bluetooth apagado', text: 'Activa el Bluetooth (y la ubicación en Android) y vuelve a intentarlo.' };
  if (name === 'NotFoundError' || name === 'NoUartWrite') return { type: 'error', title: 'Servicio UART no encontrado', text: 'Revisa en MakeCode que el programa inicie el servicio UART por Bluetooth y vuelve a descargarlo al micro:bit.' };
  if (name === 'SecurityError') return { type: 'error', title: 'Conexión no permitida', text: 'Web Bluetooth necesita HTTPS (o localhost) y que pulses tú el botón.' };
  if (name === 'NotAllowedError') return { type: 'warn', title: 'Permiso denegado', text: 'Permite a Chrome usar Bluetooth / dispositivos cercanos en los ajustes del móvil.' };
  if (name === 'AbortError') return null;
  if (name === 'TimeoutError') return { type: 'error', title: 'El coche no responde', text: 'Acerca el móvil, comprueba la batería del micro:bit y reinícialo.' };
  if (name === 'NetworkError') return { type: 'error', title: 'No se pudo conectar', text: 'Fallo de Bluetooth. Reinicia el micro:bit, acércate y vuelve a intentarlo.' };
  return { type: 'error', title: 'Algo falló al conectar', text: msg || 'Inténtalo de nuevo.' };
}

// ¿Puede este navegador usar Web Bluetooth?
const Support = {
  check() {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!window.isSecureContext) {
      return { ok: false, title: 'Abre la app por HTTPS', text: 'Web Bluetooth solo funciona en páginas https:// o en localhost. Usa GitHub Pages o un servidor local (mira el README).' };
    }
    if (!('bluetooth' in navigator)) {
      return {
        ok: false,
        title: 'Este navegador no puede usar Bluetooth',
        text: isIOS
          ? 'En iPhone/iPad, Safari no lo permite. Instala la app gratuita «Bluefy» y abre esta página desde ella. Puedes explorar la interfaz igualmente.'
          : 'Usa Google Chrome o Microsoft Edge (Android, Windows, macOS o ChromeOS). Puedes explorar la interfaz igualmente.',
      };
    }
    return { ok: true };
  },
};

/* =======================================================================
   7. INTRO ANIMADA (~5 s)
   Una sola "línea de tiempo maestra": en cada frame calculamos el tiempo t
   y, a partir de él, la posición de cada elemento. Así todo va sincronizado,
   se puede saltar en cualquier momento y solo usamos transform/opacity
   (lo más barato para el móvil) + un canvas para las partículas.
   ======================================================================= */
const Intro = (() => {
  const root = $('#intro'), cv = $('#fx'), ctx = cv.getContext('2d');
  const logo = $('#logo3d'), lgBlue = $('#lgBlue'), lgGreen = $('#lgGreen'), eyes = $('#eyesLed');
  const sheen = $('#sheen'), streamsG = $('#streams'), streams = $$('#streams path');
  const glowB = $('#glowBlue'), glowG = $('#glowGreen'), floorB = $('#floorBlue'), floorG = $('#floorGreen');
  const panel = $('#codePanel'), codeEl = $('#codeLines'), bar = $('#progBar'), progTxt = $('#progTxt'), progPct = $('#progPct');
  const flash = $('#introFlash'), skipHint = $('#introSkip');

  // Guion de tiempos (segundos)
  const T = { IN0: .25, IN1: 1.45, G0: 1.9, G1: 2.9, P0: 2.2, P1: 2.65, TY0: 2.45, TY1: 3.85, PR1: 4.0, OUT0: 4.0, OUT1: 4.3, BOOM: 4.4, REVEAL: 4.46, F0: 4.62, F1: 5.2, END: 5.25 };
  const SWEEPS = [[1.0, 1.75], [2.75, 3.45], [3.75, 4.3]];

  // Código que "se escribe solo" (clase de color, texto)
  const CODE = [
    [['f', 'bluetooth'], ['o', '.'], ['f', 'startUartService'], ['o', '()']],
    [['k', 'onUart'], ['o', '('], ['s', '"\\n"'], ['o', ', cmd => {']],
    [['o', '  '], ['k', 'if'], ['o', ' (cmd == '], ['s', '"avanzar"'], ['o', ') '], ['f', 'motores'], ['o', '(v, v)']],
    [['o', '  '], ['k', 'if'], ['o', ' ('], ['f', 'sensor'], ['o', '.cm() < '], ['n', '10'], ['o', ') '], ['f', 'parar'], ['o', '()']],
    [['o', '})']],
  ];
  const CODE_LEN = CODE.reduce((n, line) => n + line.reduce((m, [, s]) => m + s.length, 0) + 1, 0);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  let W = 0, H = 0, DPR = 1, start = 0, last = 0, t = 0, raf = 0;
  let boomed = false, revealed = false, finished = false, lastChars = -1, lastPct = -1, sheenOff = false;
  let onReveal = () => {}, resolveDone = () => {};
  const sparks = [], glows = [], bits = [];
  let rings = [];
  let sprites = null;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);   // limitar resolución = más fluidez
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // Pequeñas "bolitas de luz" pre-dibujadas (dibujar una imagen es más barato que un degradado cada frame)
  function makeSprite(rgb) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(.22, `rgba(${rgb},.9)`);
    grd.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return c;
  }

  function renderCode(n) {
    if (n === lastChars) return;
    lastChars = n;
    let left = n, html = '';
    for (const line of CODE) {
      if (left <= 0) break;
      let lineHtml = '', cut = false;
      for (const [cls, txt] of line) {
        if (left <= 0) { cut = true; break; }
        const part = txt.slice(0, left);
        left -= part.length;
        lineHtml += `<span class="${cls}">${esc(part)}</span>`;
        if (part.length < txt.length) { cut = true; break; }
      }
      const isLast = left <= 0 || cut;
      left -= 1;                                     // el salto de línea cuenta como carácter
      html += `<span class="ln">${lineHtml}${isLast ? '<i class="caret"></i>' : ''}</span>`;
      if (isLast) break;
    }
    codeEl.innerHTML = html;
  }

  function logoCenter() {
    const r = logo.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * .34, w: r.width, h: r.height };
  }

  // EXPLOSIÓN: crea las partículas de una vez (pool) — luego solo se actualizan.
  function boom() {
    boomed = true;
    const c = logoCenter();
    const S = clamp(Math.min(W, H) / 420, .7, 1.8);
    let n = Math.round(clamp(W * H / 2600, 150, 260));
    if (lowEnd) n = Math.round(n * .65);
    const palette = ['#34e27a', '#34e27a', '#5dff9d', '#a6ffca', '#e6fff0', '#5ee7ff', '#ffffff'];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (380 + Math.pow(Math.random(), .7) * 980) * S;
      const r0 = Math.random();
      sparks.push({
        x: c.x + Math.cos(a) * r0 * c.w * .42, y: c.y + Math.sin(a) * r0 * c.w * .24,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .85,
        life: 0, max: .55 + Math.random() * .75, s: .8 + Math.random() * 2.2,
        c: palette[(Math.random() * palette.length) | 0],
      });
    }
    for (let i = 0; i < (lowEnd ? 14 : 24); i++) {
      const a = Math.random() * Math.PI * 2, sp = (90 + Math.random() * 380) * S;
      glows.push({
        x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: .5 + Math.random() * .6, r: (10 + Math.random() * 22) * S,
        sp: Math.random() < .3 ? 1 : 0,
      });
    }
    rings = [
      { x: c.x, y: c.y, t: 0, dur: .8, R: Math.hypot(W, H) * .62, w: 8, col: 'rgb(170,255,205)' },
      { x: c.x, y: c.y, t: -.08, dur: .9, R: Math.hypot(W, H) * .46, w: 5, col: 'rgb(110,230,255)' },
    ];
    flash.style.left = c.x + 'px';
    flash.style.top = c.y + 'px';
  }

  // Partículas de "datos" que suben desde el código hacia el logo (se está cargando el programa).
  function spawnBits(dt) {
    if (bits.length > (lowEnd ? 22 : 36)) return;
    const pr = panel.getBoundingClientRect(), c = logoCenter();
    const k = dt * (lowEnd ? 20 : 34);                       // partículas por frame (media)
    const count = Math.floor(k) + (Math.random() < k % 1 ? 1 : 0);
    for (let i = 0; i < count; i++) {
      const x = pr.left + 18 + Math.random() * (pr.width - 36);
      bits.push({ x, y: pr.top - 4, tx: c.x + (Math.random() - .5) * c.w * .55, ty: c.y + (Math.random() - .5) * 30, p: 0, sp: .9 + Math.random() * .8, s: Math.random() < .5 ? 2 : 3 });
    }
  }

  function drawFx(dt) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // Bits de datos
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.p += dt * b.sp;
      if (b.p >= 1) { bits.splice(i, 1); continue; }
      const e = easeInOut(b.p);
      const x = lerp(b.x, b.tx, e), y = lerp(b.y, b.ty, e);
      ctx.globalAlpha = Math.sin(b.p * Math.PI) * .9;
      ctx.fillStyle = b.p > .7 ? '#d9ffe9' : '#46f08e';
      ctx.fillRect(x, y, b.s, b.s);
    }

    // Anillos de onda expansiva: halo ancho y suave + línea fina y brillante
    for (const r of rings) {
      r.t += dt;
      if (r.t <= 0 || r.t > r.dur) continue;
      const p = r.t / r.dur, e = 1 - Math.pow(1 - p, 4), fade = Math.pow(1 - p, 1.8);
      const rad = 20 + r.R * e;
      ctx.strokeStyle = r.col;
      ctx.globalAlpha = fade * .14;
      ctx.lineWidth = r.w * 3 * (1 - p * .6);
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = fade * .7;
      ctx.lineWidth = r.w * .35 * (1 - p) + .5;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
    }

    // Destellos grandes (bolas de luz)
    for (const g of glows) {
      g.life += dt;
      if (g.life >= g.max) continue;
      const k = 1 - g.life / g.max, drag = Math.pow(.18, dt);
      g.vx *= drag; g.vy *= drag;
      g.x += g.vx * dt; g.y += g.vy * dt;
      ctx.globalAlpha = k * .75;
      const rr = g.r * (.6 + .4 * k);
      ctx.drawImage(g.sp ? sprites.cyan : sprites.green, g.x - rr, g.y - rr, rr * 2, rr * 2);
    }

    // Chispas con estela (líneas cortas en la dirección del movimiento)
    ctx.lineCap = 'round';
    for (const p of sparks) {
      p.life += dt;
      if (p.life >= p.max) continue;
      const k = 1 - p.life / p.max, drag = Math.pow(.09, dt);
      p.vx *= drag; p.vy = p.vy * drag + 170 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.min(1, k * 1.25);
      ctx.strokeStyle = p.c;
      ctx.lineWidth = p.s * (.5 + .5 * k);
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * .028, p.y - p.vy * .028);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---- Un frame de la animación ----
  function frame(now) {
    if (finished) return;
    if (!start) { start = now; last = now; }
    t = (now - start) / 1000;
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;

    // 1) Entrada del logo: escala + fade + desenfoque que se aclara + inclinación 3D
    const pIn = easeOut(seg(t, T.IN0, T.IN1));
    const op = seg(t, T.IN0, .95);
    const charge = easeIn(seg(t, T.OUT0, T.BOOM));          // "carga" antes de explotar
    const boomP = easeOut(seg(t, T.BOOM, T.BOOM + .2));
    const scale = (.8 + .2 * pIn) * (1 - .07 * charge) * (1 + .35 * boomP);
    const rx = 20 * (1 - pIn) + 6 + Math.cos(t * .9) * 1.6 + Parallax.y * 6;
    const ry = -18 * (1 - pIn) + Math.sin(t * 1.15) * 5 + Parallax.x * 9;
    logo.style.opacity = (op * (1 - boomP)).toFixed(3);
    logo.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale(${scale.toFixed(4)})`;
    const blur = 9 * (1 - pIn);
    logo.style.filter = blur > .15 ? `blur(${blur.toFixed(2)}px)` : 'none';

    // 2) Cambio de color azul → verde (fundido cruzado de dos capas)
    const g = easeInOut(seg(t, T.G0, T.G1));
    lgGreen.setAttribute('opacity', g.toFixed(3));
    lgBlue.setAttribute('opacity', (1 - g * .999).toFixed(3));
    const pulse = .82 + .18 * Math.sin(t * 5.2);           // energía: el brillo "respira"
    const glowI = op * (1 - boomP) * (g > 0 ? lerp(1, pulse, g) : 1) * (1 + .7 * charge);
    const gs = 1 + .03 * Math.sin(t * 2.4) + .22 * charge + .9 * boomP;
    glowB.style.opacity = (glowI * (1 - g)).toFixed(3);
    glowG.style.opacity = Math.min(1, glowI * g).toFixed(3);
    glowB.style.transform = glowG.style.transform = `translate(-50%, -50%) scale(${gs.toFixed(3)})`;
    floorB.style.opacity = (op * (1 - g) * (1 - boomP) * .9).toFixed(3);
    floorG.style.opacity = (op * g * (1 - boomP) * pulse).toFixed(3);
    eyes.setAttribute('opacity', (g * (charge > 0 ? 1 : .35 + .65 * Math.pow(Math.sin(t * 3.4), 2))).toFixed(3));

    // 3) Reflejo que recorre el logo (3 pasadas)
    let sx = null;
    for (const [a, b] of SWEEPS) if (t >= a && t <= b) sx = -150 + 490 * easeInOut(seg(t, a, b));
    if (sx !== null) { sheen.setAttribute('transform', `translate(${sx.toFixed(1)} 0) skewX(-20)`); sheenOff = false; }
    else if (!sheenOff) { sheen.setAttribute('transform', 'translate(-200 0) skewX(-20)'); sheenOff = true; }

    // 4) Flujo de datos recorriendo el contorno
    const sv = seg(t, 2.5, 2.9) * (1 - seg(t, 4.3, 4.45));
    streamsG.setAttribute('opacity', sv.toFixed(3));
    if (sv > 0) {
      const speed = [300, 380, 460];
      const phase = [0, 333, 666];
      streams.forEach(p => {
        const i = +p.dataset.s;
        p.setAttribute('stroke-dashoffset', (-((t * speed[i] * (1 + charge * 2.5) + phase[i]) % 1000)).toFixed(1));
      });
    }

    // 5) Panel de código: aparece, se escribe solo, barra de progreso y se va
    const pin = easeOut(seg(t, T.P0, T.P1)), pout = easeIn(seg(t, T.OUT0, T.OUT1));
    panel.style.opacity = (pin * (1 - pout)).toFixed(3);
    panel.style.transform = `translateY(${((1 - pin) * 16 - pout * 8).toFixed(2)}px) scale(${(.97 + .03 * pin - .04 * pout).toFixed(4)})`;
    if (t >= T.TY0 - .05) renderCode(Math.floor(seg(t, T.TY0, T.TY1) * CODE_LEN));
    const pr = easeInOut(seg(t, T.TY0, T.PR1));
    bar.style.transform = `scaleX(${pr.toFixed(4)})`;
    const pct = Math.round(pr * 100);
    if (pct !== lastPct) {
      lastPct = pct;
      progPct.textContent = pct + '%';
      if (pct === 100) progTxt.textContent = '✓ Programa cargado';
    }

    // 6) Indicación de "toca para saltar"
    skipHint.style.opacity = (seg(t, .9, 1.4) * (1 - seg(t, 3.9, 4.2)) * .9).toFixed(3);

    // 7) Canvas: bits subiendo y, después, la explosión
    if (t > 2.55 && t < 3.95 && !reduceMotion) spawnBits(dt);
    if (!boomed && t >= T.BOOM) boom();
    drawFx(dt);

    // 8) Destello de la explosión
    if (boomed) {
      const fUp = seg(t, T.BOOM, T.BOOM + .06), fDown = seg(t, T.BOOM + .06, T.BOOM + .6);
      flash.style.opacity = (fUp * (1 - easeOut(fDown)) * .95).toFixed(3);
      flash.style.transform = `translate(-50%, -50%) scale(${(.4 + 1.1 * easeOut(seg(t, T.BOOM, T.BOOM + .7))).toFixed(3)})`;
    }

    // 9) La app emerge de la explosión y la intro se desvanece
    if (!revealed && t >= T.REVEAL) { revealed = true; onReveal(); }
    root.style.opacity = (1 - easeInOut(seg(t, T.F0, T.F1))).toFixed(3);

    if (t >= T.END) finish();
    else raf = requestAnimationFrame(frame);
  }

  function finish() {
    if (finished) return;
    finished = true;
    cancelAnimationFrame(raf);
    if (!revealed) { revealed = true; onReveal(); }
    root.hidden = true;
    cv.width = cv.height = 0;                      // libera memoria del canvas
    removeEventListener('resize', resize);
    resolveDone();
  }

  // Saltar: adelanta el reloj justo hasta antes de la explosión (para no perder el final).
  function skip() {
    if (t < T.OUT0 - .05 && start) start -= (T.OUT0 - .05 - t) * 1000;
  }

  // Versión para "movimiento reducido": logo verde, fundido y listo.
  function playReduced() {
    lgGreen.setAttribute('opacity', 1);
    lgBlue.setAttribute('opacity', 0);
    logo.style.transition = 'opacity .6s ease';
    root.style.transition = 'opacity .5s ease';
    glowG.style.opacity = '.8';
    glowG.style.transform = 'translate(-50%, -50%)';
    requestAnimationFrame(() => { logo.style.opacity = 1; });
    setTimeout(() => { revealed = true; onReveal(); root.style.opacity = 0; }, 1100);
    setTimeout(() => { finished = true; root.hidden = true; resolveDone(); }, 1650);
  }

  function play(revealCb) {
    onReveal = revealCb || onReveal;
    return new Promise(resolve => {
      resolveDone = resolve;
      try {
        if (reduceMotion) { playReduced(); return; }
        sprites = { green: makeSprite('60,240,140'), cyan: makeSprite('110,230,255') };
        resize();
        addEventListener('resize', resize);
        root.addEventListener('pointerdown', skip);
        addEventListener('keydown', e => { if (!finished && ['Enter', ' ', 'Escape'].includes(e.key)) skip(); });
        raf = requestAnimationFrame(frame);
        // Red de seguridad: pase lo que pase, la intro termina.
        setTimeout(finish, 9000);
      } catch (e) {
        console.error('[Intro]', e);
        finish();
      }
    });
  }

  return { play };
})();

/* ========== 8. DIÁLOGO DE BIENVENIDA / AJUSTES ========== */
const Sheet = (() => {
  const modal = $('#modal'), title = $('#sheetTitle'), text = $('#sheetText'), actions = $('#sheetActions');
  const themeSeg = $('#themeSeg'), sw = $('#accentSw'), hap = $('#hapticsSw'), scrim = $('#modalScrim');
  let resolver = null, mode = 'welcome';

  function sync() {
    themeSeg.dataset.v = Prefs.data.theme;
    $$('button', themeSeg).forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === Prefs.data.theme)));
    $$('button', sw).forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === Prefs.data.accent)));
    hap.setAttribute('aria-checked', String(Prefs.data.haptics));
  }
  themeSeg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    Prefs.set('theme', b.dataset.v); sync(); Haptics.pulse(8);
  });
  sw.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    Prefs.set('accent', b.dataset.v); sync(); Haptics.pulse(8);
  });
  hap.addEventListener('click', () => {
    Prefs.set('haptics', !Prefs.data.haptics); sync(); Haptics.pulse(15);
  });

  function button(label, cls, icon, value) {
    const b = document.createElement('button');
    b.className = `btn ${cls}`;
    b.innerHTML = icon ? `<svg class="ic"><use href="#${icon}"/></svg>` : '';
    b.append(label);
    b.addEventListener('click', () => { Haptics.pulse(10); close(value); });
    return b;
  }

  function open(m = 'welcome') {
    mode = m;
    actions.innerHTML = '';
    if (m === 'welcome') {
      title.textContent = '¿Quieres una guía rápida?';
      text.textContent = 'Te enseño en medio minuto para qué sirve cada control. Antes, elige cómo quieres ver la app.';
      actions.append(button('No, gracias', 'ghost', null, 'skip'), button('Sí, guíame', 'primary', 'i-guide', 'tour'));
    } else {
      title.textContent = 'Ajustes';
      text.textContent = 'Personaliza la app o repite la guía cuando quieras.';
      actions.append(button('Ver guía', 'ghost', 'i-guide', 'tour'), button('Listo', 'primary', 'i-check', 'close'));
    }
    sync();
    modal.hidden = false;
    document.body.classList.add('lock');
    requestAnimationFrame(() => requestAnimationFrame(() => modal.classList.add('on')));
    setTimeout(() => { const p = $('.btn.primary', actions); p && p.focus({ preventScroll: true }); }, 350);
    return new Promise(r => { resolver = r; });
  }
  function close(value) {
    if (modal.hidden || !resolver) return;
    modal.classList.remove('on');
    setTimeout(() => { modal.hidden = true; if (!Tour.active) document.body.classList.remove('lock'); }, 420);
    const r = resolver; resolver = null; r(value);
  }
  scrim.addEventListener('click', () => close(mode === 'welcome' ? 'skip' : 'close'));
  addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) close(mode === 'welcome' ? 'skip' : 'close'); });

  return { open, get isOpen() { return !modal.hidden; } };
})();

/* ========== 9. GUÍA PASO A PASO ========== */
const Tour = (() => {
  const el = $('#tour'), hole = $('#tourHole'), card = $('#tourCard');
  const stepEl = $('#tourStep'), titleEl = $('#tourTitle'), textEl = $('#tourText'), dots = $('#tourDots');
  const nextBtn = $('#tourNext'), skipBtn = $('#tourSkip');
  const STEPS = [
    { sel: '#status', title: 'Estado de la conexión', text: 'Te dice en todo momento cómo está el coche: gris = desconectado, ámbar = conectando, verde = conectado.', round: true },
    { sel: '#connectBtn', title: 'Conectar', text: 'Púlsalo y elige tu «BBC micro:bit» en la lista. Se conecta por Bluetooth, sin códigos. Vuelve a pulsarlo para desconectar.' },
    { sel: '#pad', title: 'Cruceta de movimiento', text: 'Mantén pulsada una flecha para avanzar, retroceder o girar. Al soltarla, el coche se para solo.', round: true, pad: 4 },
    { sel: '#stopBtn', title: 'PARAR', text: 'Freno de emergencia: detiene el coche al instante, pase lo que pase.', round: true, pad: 12 },
    { sel: '#speedCard', title: 'Velocidad', text: 'Desliza de 0 a 100 para ajustar la potencia. El arco cambia de color: azul suave, verde normal, naranja rápido.' },
    { sel: '#extras', title: 'Extras', text: 'Bocina hace sonar el zumbador. Luces enciende o apaga los intermitentes. Seguridad activa la frenada automática con el sensor.' },
    { sel: '#settingsBtn', title: 'Ajustes', text: 'Cambia el tema, el color o la vibración, y repite esta guía cuando quieras. ¡A conducir!', round: true },
  ];
  let i = 0, resolver = null, active = false, target = null;

  dots.innerHTML = STEPS.map(() => '<i></i>').join('');

  function place() {
    if (!target) return;
    const s = STEPS[i];
    const r = target.getBoundingClientRect();
    const pad = s.pad ?? 8;
    const x = r.left - pad, y = r.top - pad, w = r.width + pad * 2, h = r.height + pad * 2;
    const br = s.round ? Math.min(w, h) / 2 : (parseFloat(getComputedStyle(target).borderTopLeftRadius) || 16) + pad;
    hole.style.width = w + 'px';
    hole.style.height = h + 'px';
    hole.style.borderRadius = br + 'px';
    hole.style.transform = `translate(${x}px, ${y}px)`;
    // La tarjeta va debajo si cabe; si no, encima.
    const cw = Math.min(360, innerWidth - 32);
    card.style.width = cw + 'px';
    const ch = card.offsetHeight;
    let top = y + h + 14;
    if (top + ch > innerHeight - 12) top = y - 14 - ch;
    if (top < 12) top = clamp(innerHeight - ch - 16, 12, innerHeight);
    const left = clamp(x + w / 2 - cw / 2, 16, innerWidth - cw - 16);
    card.style.transform = `translate(${left}px, ${top}px)`;
  }

  async function show() {
    const s = STEPS[i];
    target = $(s.sel);
    card.classList.add('swap');
    const r = target.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 190) {
      target.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
      await sleep(420);
    }
    await sleep(140);
    stepEl.textContent = `Paso ${i + 1} de ${STEPS.length}`;
    titleEl.textContent = s.title;
    textEl.textContent = s.text;
    nextBtn.textContent = i === STEPS.length - 1 ? '¡Listo!' : 'Siguiente';
    $$('i', dots).forEach((d, k) => d.classList.toggle('on', k === i));
    place();
    card.classList.remove('swap');
  }

  function next() {
    Haptics.pulse(8);
    if (i < STEPS.length - 1) { i++; show(); } else end();
  }
  function end() {
    if (!active) return;
    active = false;
    el.classList.remove('on');
    setTimeout(() => { el.hidden = true; document.body.classList.remove('lock'); }, 420);
    const r = resolver; resolver = null; r && r();
  }

  nextBtn.addEventListener('click', next);
  skipBtn.addEventListener('click', () => { Haptics.pulse(8); end(); });
  addEventListener('resize', () => active && place());
  addEventListener('keydown', e => {
    if (!active) return;
    if (e.key === 'Escape') end();
    else if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
  });
  // Evitar que la página se desplace por debajo de la guía.
  el.addEventListener('wheel', e => e.preventDefault(), { passive: false });
  el.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  function start() {
    return new Promise(resolve => {
      resolver = resolve;
      active = true;
      i = 0;
      document.body.classList.add('lock');
      el.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
      show();
      setTimeout(() => nextBtn.focus({ preventScroll: true }), 400);
    });
  }
  return { start, get active() { return active; } };
})();

/* =======================================================================
   10. CONTROLES DEL COCHE
   ======================================================================= */
const ui = {
  status: $('#status'), statusText: $('#statusText'), statusIcon: $('#statusIcon'),
  connectBtn: $('#connectBtn'), connectLabel: $('#connectLabel'), connectSub: $('#connectSub'), connectIcon: $('#connectIcon'), cbFlash: $('#cbFlash'),
  pad: $('#pad'), stopBtn: $('#stopBtn'), stopRing: $('#stopRing'),
  speed: $('#speed'), speedCard: $('#speedCard'), speedNum: $('#speedNum'), speedTag: $('#speedTag'), gVal: $('#gVal'),
  horn: $('#hornBtn'), lights: $('#lightsBtn'), safety: $('#safetyBtn'),
  lastCmd: $('#lastCmd'), lastRx: $('#lastRx'),
  notice: $('#notice'), noticeTitle: $('#noticeTitle'), noticeText: $('#noticeText'),
  settings: $('#settingsBtn'),
};

let support = { ok: true };
let prevState = 'disconnected';
const extrasState = { luces: false, seguridad: false };

// --- Instancia del Bluetooth con sus "manejadores" de eventos ---
const ble = new MicrobitUART({
  onStatus: (state, info) => {
    renderConnection(state, info);
    if (state === 'connected') {
      Haptics.pulse([12, 60, 18]);
      ui.cbFlash.animate(
        [{ transform: 'scale(1)', opacity: .9 }, { transform: 'scale(2.6)', opacity: 0 }],
        { duration: 750, easing: EASE }
      );
      // Al conectar: estados de extras a OFF, coche parado y velocidad sincronizada.
      setExtra('luces', false); setExtra('seguridad', false);
      ble.send('parar');
      ble.send('vel' + speedValue());
      lastVelSent = speedValue();
      Toast.show({ type: 'ok', title: info.reconnected ? 'Reconectado' : '¡Conectado!', text: info.name || 'BBC micro:bit' });
    } else if (prevState === 'connected') {
      releaseAll(false);                                  // conexión perdida: la cruceta vuelve a reposo
    }
    if (state === 'disconnected') {
      releaseAll(false);
      if (info.reason === 'lost') {
        Haptics.pulse([40, 60, 40]);
        Toast.show({ type: 'error', title: 'Se perdió la conexión', text: 'El coche se ha desconectado.', action: { label: 'Reconectar', run: () => tryConnect(true) } });
      } else if (info.reason === 'user' && prevState === 'connected') {
        Toast.show({ type: 'info', title: 'Coche desconectado' });
      }
    }
    prevState = state;
  },
  onSent: cmd => showSent(cmd, 'sent'),
  onReceive: text => {
    ui.lastRx.textContent = text.length > 18 ? text.slice(0, 17) + '…' : text;
    ui.lastRx.dataset.state = 'sent';
    ui.lastRx.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 300, easing: EASE });
  },
  onSendError: () => { /* el reintento ya se hizo; no saturamos con avisos */ },
});

function renderConnection(state, info = {}) {
  const S = { disconnected: ['Desconectado', 'i-bt-off'], connecting: ['Conectando…', 'i-bt'], connected: ['Conectado', 'i-bt-on'] }[state];
  ui.status.dataset.state = state;
  ui.statusText.textContent = S[0];
  ui.statusIcon.setAttribute('href', '#' + S[1]);
  ui.connectBtn.dataset.state = state;
  if (state === 'connecting') {
    ui.connectIcon.setAttribute('href', '#i-bt');
    if (info.phase === 'search') { ui.connectLabel.textContent = 'Buscando…'; ui.connectSub.textContent = 'Elige tu «BBC micro:bit» en la lista'; }
    else if (info.phase === 'reconnect') { ui.connectLabel.textContent = 'Reconectando…'; ui.connectSub.textContent = `Intento ${info.attempt} · toca para cancelar`; }
    else { ui.connectLabel.textContent = 'Conectando…'; ui.connectSub.textContent = info.name || 'micro:bit'; }
  } else if (state === 'connected') {
    ui.connectIcon.setAttribute('href', '#i-check');
    ui.connectLabel.textContent = 'Desconectar';
    ui.connectSub.textContent = info.name || 'BBC micro:bit';
  } else {
    ui.connectIcon.setAttribute('href', '#i-bt');
    ui.connectLabel.textContent = ble.device ? 'Conectar de nuevo' : 'Conectar coche';
    ui.connectSub.textContent = support.ok ? 'Toca para buscar tu micro:bit' : 'Bluetooth no disponible aquí';
  }
}

async function tryConnect(reuseDevice = false) {
  if (!support.ok) {
    Toast.show({ type: 'warn', title: support.title, text: support.text });
    ui.notice.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.02)' }, { transform: 'scale(1)' }], { duration: 400, easing: EASE });
    return;
  }
  try {
    if (reuseDevice && ble.device) await ble.reconnect();
    else await ble.connect();
  } catch (e) {
    console.warn('[BLE]', e);
    const info = explainBleError(e);
    if (info) {
      if (info.type !== 'info') Haptics.pulse([30, 50, 30]);
      Toast.show(info);
    }
  }
}

ui.connectBtn.addEventListener('click', () => {
  Haptics.pulse(10);
  if (ble.state === 'connected') ble.disconnect();
  else if (ble.state === 'connecting') { if (ble.device) ble.disconnect(); }   // cancelar reconexión
  else tryConnect(false);
});

// --- Enviar un comando (con feedback visual del protocolo) ---
let lastNudge = 0;
function send(cmd, { quiet = false } = {}) {
  const ok = ble.send(cmd);
  showSent(cmd, ok ? 'pending' : 'offline');
  if (!ok && !quiet) nudgeConnect();
  return ok;
}
function showSent(cmd, state) {
  ui.lastCmd.textContent = cmd;
  ui.lastCmd.dataset.state = state;
  if (state !== 'sent') ui.lastCmd.animate([{ opacity: .35, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: EASE });
}
// Si no hay conexión: aviso elegante (como mucho cada 2,5 s) y el botón Conectar "tiembla".
function nudgeConnect() {
  const now = performance.now();
  ui.connectBtn.classList.remove('shake');
  void ui.connectBtn.offsetWidth;
  ui.connectBtn.classList.add('shake');
  if (now - lastNudge < 2500 || ble.state === 'connecting') return;
  lastNudge = now;
  Toast.show(support.ok
    ? { type: 'info', title: 'Conecta primero el coche', text: 'Pulsa Conectar y elige tu micro:bit.', action: { label: 'Conectar', run: () => tryConnect(false) } }
    : { type: 'warn', title: support.title, text: support.text });
}

/* --- Cruceta: mantener pulsado = moverse, soltar = parar ---
   Usamos Pointer Events (sirven para dedo, ratón y lápiz) y "capturamos" el
   puntero para no perder el "soltar" aunque el dedo se salga del botón.
   Si hay varios dedos, al soltar uno vuelve a la dirección que siga pulsada. */
const held = new Map();      // id del puntero/tecla → { btn, cmd }
let moveCmd = 'parar';

function setMove(cmd, force = false) {
  if (cmd === moveCmd && !force) return;
  moveCmd = cmd;
  const moving = cmd !== 'parar';
  ui.pad.dataset.moving = moving ? '1' : '0';
  if (moving) ui.pad.dataset.last = cmd;
  send(cmd, { quiet: !moving });
}

function pressDir(btn, id) {
  held.set(id, { btn, cmd: btn.dataset.cmd });
  btn.classList.add('is-pressed');
  Haptics.pulse(12);
  setMove(btn.dataset.cmd);
}
function releaseDir(id) {
  const h = held.get(id);
  if (!h) return;
  held.delete(id);
  const rest = [...held.values()];
  if (!rest.some(v => v.btn === h.btn)) h.btn.classList.remove('is-pressed');
  setMove(rest.length ? rest[rest.length - 1].cmd : 'parar');
}
function releaseAll(sendStop = true) {
  held.forEach(h => h.btn.classList.remove('is-pressed'));
  held.clear();
  ui.pad.dataset.moving = '0';
  if (sendStop) setMove('parar', true);
  else moveCmd = 'parar';
}

$$('.dbtn', ui.pad).forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { btn.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
    pressDir(btn, 'p' + e.pointerId);
  });
  const up = e => releaseDir('p' + e.pointerId);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
});
ui.pad.addEventListener('contextmenu', e => e.preventDefault());   // sin menú al mantener pulsado

// PARAR: siempre envía "parar", aunque ya estuviera parado.
ui.stopBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  ui.stopBtn.classList.add('is-pressed');
  Haptics.pulse(28);
  ui.stopRing.animate([{ transform: 'scale(1)', opacity: .8 }, { transform: 'scale(1.7)', opacity: 0 }], { duration: 600, easing: EASE });
  releaseAll(true);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => ui.stopBtn.addEventListener(ev, () => ui.stopBtn.classList.remove('is-pressed')));
ui.stopBtn.addEventListener('keydown', e => { if (e.key === 'Enter') releaseAll(true); });

// Teclado en el ordenador: flechas / WASD (mantener) y Espacio = parar, H = bocina.
const KEYS = { ArrowUp: 'avanzar', KeyW: 'avanzar', ArrowDown: 'atras', KeyS: 'atras', ArrowLeft: 'izquierda', KeyA: 'izquierda', ArrowRight: 'derecha', KeyD: 'derecha' };
addEventListener('keydown', e => {
  if (Sheet.isOpen || Tour.active || !$('#intro').hidden) return;
  if (document.activeElement === ui.speed && e.code.startsWith('Arrow')) return;
  const cmd = KEYS[e.code];
  if (cmd) {
    e.preventDefault();
    if (e.repeat) return;
    pressDir($(`.dbtn[data-cmd="${cmd}"]`, ui.pad), 'k' + e.code);
  } else if (e.code === 'Space' && !e.repeat && !(document.activeElement instanceof HTMLButtonElement)) {
    e.preventDefault(); ui.stopBtn.dispatchEvent(new PointerEvent('pointerdown'));
    setTimeout(() => ui.stopBtn.classList.remove('is-pressed'), 160);
  } else if (e.code === 'KeyH' && !e.repeat) {
    ui.horn.click();
  }
});
addEventListener('keyup', e => { if (KEYS[e.code]) releaseDir('k' + e.code); });

// Seguridad extra ("hombre muerto"): si la app pasa a segundo plano mientras te mueves, se para.
function deadMan() { if (moveCmd !== 'parar' || held.size) releaseAll(true); }
document.addEventListener('visibilitychange', () => { if (document.hidden) deadMan(); });
addEventListener('pagehide', deadMan);
addEventListener('blur', deadMan);

/* --- Velocidad: arco que se llena y cambia de color (azul → verde → naranja) --- */
const SPEED_STOPS = [[0, [56, 160, 255]], [50, [52, 226, 122]], [80, [255, 190, 60]], [100, [255, 124, 52]]];
function speedColor(v) {
  for (let k = 1; k < SPEED_STOPS.length; k++) {
    const [v1, c1] = SPEED_STOPS[k], [v0, c0] = SPEED_STOPS[k - 1];
    if (v <= v1) {
      const p = (v - v0) / (v1 - v0);
      return `rgb(${c0.map((c, j) => Math.round(lerp(c, c1[j], p))).join(' ')})`;
    }
  }
  return 'rgb(255 124 52)';
}
const speedValue = () => clamp(parseInt(ui.speed.value, 10) || 0, 0, 100);
function renderSpeed(v) {
  ui.gVal.style.strokeDasharray = `${Math.max(v, .001)} 100`;
  ui.gVal.style.opacity = v === 0 ? '0' : '1';
  ui.speedCard.style.setProperty('--spd', speedColor(v));
  ui.speedCard.style.setProperty('--p', v + '%');
  ui.speedNum.textContent = v;
  ui.speedTag.textContent = v === 0 ? 'PARADO' : v <= 35 ? 'SUAVE' : v <= 70 ? 'NORMAL' : 'RÁPIDO';
}
// Envío de "velXX" limitado a uno cada 80 ms (con el valor final garantizado).
let lastVelSent = null, velTimer = null, lastVelTime = 0;
function sendVel(force = false) {
  clearTimeout(velTimer);
  velTimer = null;
  const v = speedValue();
  if (v === lastVelSent && !force) return;
  lastVelTime = performance.now();
  if (ble.connected) { lastVelSent = v; send('vel' + v, { quiet: true }); }
  else showSent('vel' + v, 'offline');
}
ui.speed.addEventListener('input', () => {
  const v = speedValue();
  renderSpeed(v);
  if (v % 10 === 0) Haptics.pulse(4);
  const wait = 80 - (performance.now() - lastVelTime);
  if (wait <= 0) sendVel();
  else if (!velTimer) velTimer = setTimeout(sendVel, wait);
});
ui.speed.addEventListener('change', () => sendVel());

/* --- Extras --- */
function setExtra(key, on) {
  extrasState[key] = on;
  const btn = key === 'luces' ? ui.lights : ui.safety;
  btn.setAttribute('aria-pressed', String(on));
  $('.x-state', btn).textContent = on ? 'ON' : 'OFF';
}
ui.horn.addEventListener('click', () => {
  Haptics.pulse([14, 40, 14]);
  $$('.x-wave', ui.horn).forEach((w, k) => w.animate(
    [{ transform: 'scale(1)', opacity: .7 }, { transform: 'scale(1.9)', opacity: 0 }],
    { duration: 700, delay: k * 160, easing: EASE }
  ));
  ui.horn.classList.add('honk');
  setTimeout(() => ui.horn.classList.remove('honk'), 500);
  send('bocina');
});
// Luces y Seguridad son interruptores: el micro:bit alterna su estado con cada comando.
[[ui.lights, 'luces'], [ui.safety, 'seguridad']].forEach(([btn, key]) => {
  btn.addEventListener('click', () => {
    Haptics.pulse(12);
    if (!send(key)) {
      btn.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(0)' }], { duration: 300, easing: EASE });
      return;
    }
    setExtra(key, !extrasState[key]);
  });
});

// Ajustes
ui.settings.addEventListener('click', async () => {
  Haptics.pulse(8);
  const r = await Sheet.open('settings');
  if (r === 'tour') { await sleep(300); Tour.start(); }
});

/* ========== 11. ARRANQUE ========== */
function renderSupport() {
  support = Support.check();
  ui.notice.hidden = support.ok;
  if (!support.ok) {
    ui.noticeTitle.textContent = support.title;
    ui.noticeText.textContent = support.text;
  }
  renderConnection('disconnected');
  // Si el adaptador Bluetooth está apagado o no existe, lo avisamos (y lo quitamos al activarlo).
  if (support.ok && navigator.bluetooth.getAvailability) {
    const showOff = available => {
      if (!available) {
        ui.notice.hidden = false;
        ui.noticeTitle.textContent = 'Bluetooth no disponible';
        ui.noticeText.textContent = 'Activa el Bluetooth del dispositivo para conectar con el coche.';
      } else if (support.ok) ui.notice.hidden = true;
    };
    navigator.bluetooth.getAvailability().then(showOff).catch(() => {});
    try { navigator.bluetooth.addEventListener('availabilitychanged', e => showOff(e.value)); } catch (e) { /* no soportado */ }
  }
}

async function boot() {
  Prefs.load().apply();
  Parallax.init();
  renderSpeed(speedValue());
  renderSupport();
  // Esperamos (como mucho medio segundo) a la tipografía para que el logo no "salte".
  try { await Promise.race([document.fonts ? document.fonts.ready : null, sleep(500)]); } catch (e) { /* nada */ }
  try {
    await Intro.play(() => document.body.classList.add('app-in'));
  } catch (e) {
    console.error(e);
    document.body.classList.add('app-in');
    $('#intro').hidden = true;
  }
  document.body.classList.remove('lock');
  await sleep(reduceMotion ? 0 : 280);          // deja terminar la entrada de las tarjetas
  const choice = await Sheet.open('welcome');
  if (choice === 'tour') { await sleep(300); await Tour.start(); }
}

// Para depurar desde la consola durante la presentación: SV.ble, SV.send('avanzar')
window.SV = { ble, send };
boot();
</script>
