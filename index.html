<!DOCTYPE html>
<html lang="es" data-theme="dark" data-accent="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguridad Vial · micro:bit</title>
<meta name="description" content="Controla el coche Maqueen con micro:bit por Bluetooth desde el móvil.">
<meta name="theme-color" content="#060a11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23060a11'/%3E%3Crect x='9' y='18' width='46' height='28' rx='12' fill='none' stroke='%2334e27a' stroke-width='5'/%3E%3Ccircle cx='25' cy='32' r='4' fill='%2334e27a'/%3E%3Ccircle cx='39' cy='32' r='4' fill='%2334e27a'/%3E%3C/svg%3E">

<!-- Tipografías (si no hay internet, se usan las del sistema y todo sigue funcionando) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Las fuentes se cargan sin bloquear: si internet va lento o está bloqueado, la página se abre igual con las letras del sistema -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<!-- Aplica el tema guardado ANTES de pintar, para que no haya parpadeo de colores -->
<script>
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('sv-prefs-v1') || '{}');
      var d = document.documentElement;
      d.dataset.theme = p.theme === 'light' ? 'light' : 'dark';
      d.dataset.accent = ['green', 'cyan', 'violet'].indexOf(p.accent) >= 0 ? p.accent : 'green';
    } catch (e) { /* sin almacenamiento: valores por defecto */ }
  })();
</script>

<style>
/* =====================================================================
   1. TOKENS DE DISEÑO
   Todos los colores, curvas y radios salen de aquí: así el tema claro/oscuro
   y el color de acento cambian toda la app de golpe y todo es coherente.
   ===================================================================== */
:root {
  --ease: cubic-bezier(.22, 1, .36, 1);      /* ease-out elegante: la curva "de la casa" */
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-lg: 24px;
  --r-md: 18px;
  /* Colores de estado (en formato "R G B" para poder usar transparencias) */
  --ok: 52 226 122;
  --warn: 255 176 32;
  --danger: 255 59 78;
  --off: 139 151 170;
  --amber: 255 184 46;
  --pad: min(80vw, 330px, 41dvh);            /* tamaño de la cruceta */
}

:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #060a11;
  --bg-2: #0c1524;
  --text: #e9eef6;
  --muted: #8b97aa;
  --faint: rgba(255, 255, 255, .055);
  --faint-2: rgba(255, 255, 255, .09);
  --line: rgba(255, 255, 255, .085);
  --glass: rgba(17, 25, 39, .55);
  --glass-strong: rgba(15, 22, 35, .82);
  --glass-hi: rgba(255, 255, 255, .07);
  --glass-border: rgba(255, 255, 255, .085);
  --shadow: 0 18px 40px -14px rgba(0, 0, 0, .65);
  --dot: rgba(255, 255, 255, .075);
  --orb-k: 1;
  --glow-k: 1;                                /* intensidad del neón: más en oscuro */
  --key-top: #273349;
  --key-bot: #19212f;
  --key-side: #0a0f18;
  --key-text: #c9d3e2;
  --plate: radial-gradient(circle at 50% 38%, rgba(255,255,255,.07), rgba(255,255,255,.02) 55%, rgba(255,255,255,.01) 70%);
  --scrim: rgba(2, 5, 10, .62);
  --on-a: #04130a;
  --seg-thumb: rgba(255, 255, 255, .11);
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf1f6;
  --bg-2: #f8fafc;
  --text: #0e1726;
  --muted: #5d697c;
  --faint: rgba(15, 23, 42, .045);
  --faint-2: rgba(15, 23, 42, .085);
  --line: rgba(15, 23, 42, .08);
  --glass: rgba(255, 255, 255, .6);
  --glass-strong: rgba(255, 255, 255, .86);
  --glass-hi: rgba(255, 255, 255, .95);
  --glass-border: rgba(255, 255, 255, .9);
  --shadow: 0 16px 36px -16px rgba(30, 41, 59, .28);
  --dot: rgba(15, 23, 42, .085);
  --orb-k: .7;
  --glow-k: .45;
  --key-top: #ffffff;
  --key-bot: #e8edf4;
  --key-side: #c4cdd9;
  --key-text: #334155;
  --plate: radial-gradient(circle at 50% 38%, rgba(255,255,255,.9), rgba(255,255,255,.45) 55%, rgba(255,255,255,.25) 70%);
  --scrim: rgba(15, 23, 42, .42);
  --on-a: #ffffff;
  --seg-thumb: #ffffff;
  --ok: 22 163 74;
  --warn: 217 119 6;
  --danger: 225 29 56;
  --off: 100 116 139;
  --amber: 217 119 6;
}

/* Colores de acento elegibles (versión oscura y versión clara con más contraste) */
:root[data-accent="green"]  { --a: 52 226 122; }
:root[data-accent="cyan"]   { --a: 34 211 238; }
:root[data-accent="violet"] { --a: 167 139 250; }
:root[data-theme="light"][data-accent="green"]  { --a: 22 163 74; }
:root[data-theme="light"][data-accent="cyan"]   { --a: 8 145 178; }
:root[data-theme="light"][data-accent="violet"] { --a: 124 58 237; }

/* Transición suave al cambiar de tema (View Transitions API si existe) */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .5s; animation-timing-function: var(--ease); }

/* =====================================================================
   2. BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;                 /* evita el "tirar para recargar" mientras conduces */
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible, input:focus-visible { outline: 2px solid rgb(var(--a)); outline-offset: 3px; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
body.lock { overflow: hidden; }

/* =====================================================================
   3. FONDO CON PROFUNDIDAD (parallax sutil)
   Dos capas a distinta "distancia": rejilla de puntos y luces difusas.
   Se mueven con el giroscopio o el dedo, muy poco, solo con transform.
   ===================================================================== */
.bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background: radial-gradient(120% 70% at 50% -10%, var(--bg-2), var(--bg) 62%);
}
.bg-grid {
  position: absolute; inset: -40px;
  background-image: radial-gradient(circle at center, var(--dot) 1.1px, transparent 1.7px);
  background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 25%, transparent 82%);
          mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 25%, transparent 82%);
  will-change: transform;
}
.bg-depth { position: absolute; inset: 0; will-change: transform; }
.bg-orb { position: absolute; width: 75vmax; height: 75vmax; border-radius: 50%; opacity: var(--orb-k); }
.bg-orb.o1 { left: -32vmax; top: -34vmax; background: radial-gradient(closest-side, rgb(var(--a) / .14), transparent 72%); }
.bg-orb.o2 { right: -36vmax; bottom: -40vmax; background: radial-gradient(closest-side, rgba(56, 140, 248, .12), transparent 72%); }

/* =====================================================================
   4. INTRO (logo 3D → modo programación → explosión)
   La intro es siempre oscura (cinematográfica) y la anima JS frame a frame.
   ===================================================================== */
.intro {
  position: fixed; inset: 0; z-index: 100; overflow: hidden;
  display: grid; place-items: center;
  background: radial-gradient(90% 60% at 50% 42%, #0c1828 0%, #060b14 55%, #030509 100%);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  color: #e9eef6;
}
.intro::before {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1.6px);
  background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 45%, #000, transparent 75%);
          mask-image: radial-gradient(ellipse 60% 50% at 50% 45%, #000, transparent 75%);
}
.intro-stage {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(26px, 6vh, 46px);
  perspective: 900px;
  margin-top: -3vh;
}
.logo-wrap { position: relative; width: min(60vw, 270px); }
.logo3d {
  position: relative; z-index: 1; opacity: 0;
  transform-origin: 50% 40%;
  will-change: transform, opacity;
}
.logo-svg { display: block; width: 100%; height: auto; overflow: visible; }
.logo-text { font-family: var(--font); font-weight: 800; font-size: 47px; letter-spacing: -1.2px; }
.glow, .floor { position: absolute; left: 50%; border-radius: 50%; opacity: 0; pointer-events: none; will-change: transform, opacity; }
.glow { top: 34%; width: 200%; aspect-ratio: 1.45; transform: translate(-50%, -50%); }
.glow-blue  { background: radial-gradient(closest-side, rgba(64,170,255,.42), rgba(40,120,255,.12) 52%, transparent 74%); }
.glow-green { background: radial-gradient(closest-side, rgba(50,235,125,.48), rgba(0,200,100,.13) 52%, transparent 74%); }
.floor { bottom: -9%; width: 86%; height: 13%; transform: translateX(-50%); }
.floor-blue  { background: radial-gradient(closest-side, rgba(90,185,255,.38), transparent); }
.floor-green { background: radial-gradient(closest-side, rgba(70,240,140,.42), transparent); }

/* Panel de "código escribiéndose solo" */
.code-panel {
  width: min(86vw, 340px);
  padding: 12px 15px 12px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(14, 32, 25, .82), rgba(8, 20, 16, .82));
  border: 1px solid rgba(52, 226, 122, .18);
  box-shadow: 0 24px 50px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
  font: 500 clamp(10px, 3.05vw, 12px)/1.7 var(--mono);
  color: #c6ecd6;
  opacity: 0;
  will-change: transform, opacity;
}
.code-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: rgba(198, 236, 214, .45); font-size: 10.5px; letter-spacing: .06em; }
.code-head i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.14); }
.code-head i:first-child { background: rgba(52, 226, 122, .6); }
.code-head span { margin-left: auto; }
.code-lines { min-height: calc(5 * 1.7em); }
.code-lines .ln { display: block; white-space: pre; overflow: hidden; }
.code-lines .k { color: #6ff0a8; } .code-lines .f { color: #82d8ff; } .code-lines .s { color: #ffd479; }
.code-lines .n { color: #ff9f6e; } .code-lines .o { color: #d5e3dc; }
.caret { display: inline-block; width: .55em; height: 1.1em; margin-left: 1px; vertical-align: -.2em; background: #6effa8; animation: blink .9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.progress { position: relative; height: 3px; margin-top: 10px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.progress i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #2bd4f0, #34e27a); box-shadow: 0 0 12px rgba(52,226,122,.7); }
.progress-meta { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: rgba(198, 236, 214, .55); }
.progress-meta b { color: #7dffb0; font-weight: 600; }

.intro-flash {
  position: absolute; z-index: 2; left: 50%; top: 45%;
  width: 240vmax; height: 240vmax; border-radius: 50%;
  background: radial-gradient(circle, rgba(240,255,246,.95) 0%, rgba(110,245,165,.55) 4%, rgba(40,210,120,.2) 10%, rgba(20,160,90,.06) 18%, transparent 30%);
  transform: translate(-50%, -50%) scale(.4); opacity: 0;
  pointer-events: none; will-change: transform, opacity;
}
#fx { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
.intro-skip {
  position: absolute; z-index: 4; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  text-align: center; font: 500 11px var(--font); letter-spacing: .16em; text-transform: uppercase;
  color: rgba(255, 255, 255, .34); opacity: 0;
}

/* =====================================================================
   5. LAYOUT DE LA APP
   ===================================================================== */
.app {
  position: relative; z-index: 1;
  max-width: 480px; min-height: 100dvh; margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px;
}
/* Entrada escalonada de las piezas al salir de la explosión */
.reveal {
  opacity: 0; transform: translateY(16px) scale(.985);
  transition: opacity .8s var(--ease), transform .95s var(--ease);
  transition-delay: calc(var(--i, 0) * 70ms);
}
body.app-in .reveal { opacity: 1; transform: none; }

/* Vidrio esmerilado (glassmorphism) */
.card {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
          backdrop-filter: blur(16px) saturate(140%);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .card { background: var(--glass-strong); }
}

/* ---------- Cabecera ---------- */
.topbar { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 9px; z-index: 5; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
.brand-mark {
  position: relative; width: 44px; height: 44px; flex: none; border-radius: 14px;
  display: grid; place-items: center; overflow: hidden;
  background: linear-gradient(150deg, rgb(var(--a)), rgb(var(--a) / .62));
  color: var(--on-a);
  box-shadow: 0 8px 20px -8px rgb(var(--a) / calc(.8 * var(--glow-k))), inset 0 1px 0 rgba(255,255,255,.45);
}
.brand-mark::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(180deg, rgba(255,255,255,.35), transparent); }
.brand-mark svg { width: 28px; height: auto; position: relative; }
.brand-text { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; line-height: 1.15; }
.brand-text b { display: block; max-width: 100%; font-size: 16px; font-weight: 750; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text b small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }

/* Indicador de estado: color + icono + texto */
.status {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px 0 6px;
  border-radius: 99px; background: var(--faint); border: 1px solid var(--line);
  font-size: 11px; font-weight: 650; color: rgb(var(--off)); white-space: nowrap;
  transition: color .35s, background-color .35s, border-color .35s;
}
.status-ic { position: relative; display: grid; place-items: center; width: 13px; height: 13px; }
.status-ic svg { width: 13px; height: 13px; stroke-width: 2.4; }
.status-ic::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0; }
.status[data-state="connecting"] { color: rgb(var(--warn)); background: rgb(var(--warn) / .1); border-color: rgb(var(--warn) / .25); }
.status[data-state="connecting"] .status-ic svg { animation: breathe 1s var(--ease-io) infinite alternate; }
.status[data-state="connected"] { color: rgb(var(--ok)); background: rgb(var(--ok) / .1); border-color: rgb(var(--ok) / .28); }
.status[data-state="connected"] .status-ic::after { animation: halo 2.2s var(--ease) infinite; }
@keyframes breathe { from { opacity: .35; transform: scale(.9); } to { opacity: 1; transform: scale(1.05); } }
@keyframes halo { 0% { opacity: .7; transform: scale(.6); } 70%, 100% { opacity: 0; transform: scale(1.5); } }

@media (max-width: 350px) { .brand-text b small { display: none; } }

.icon-btn {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  border-radius: 12px; border: 1px solid var(--line); background: var(--faint); color: var(--muted);
  transition: transform .2s var(--ease), color .2s, background-color .2s;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn:hover { color: var(--text); }

/* ---------- Aviso de compatibilidad ---------- */
.notice { display: flex; gap: 12px; padding: 13px 14px; border-color: rgb(var(--warn) / .3); }
.notice-ic { width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center; background: rgb(var(--warn) / .14); color: rgb(var(--warn)); }
.notice b { display: block; font-size: 14px; margin: 1px 0 3px; }
.notice p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }

/* ---------- Botón Conectar con anillo radar ---------- */
.connect-card { padding: 8px; display: flex; align-items: center; }
.connect-btn {
  position: relative; width: 100%; display: flex; align-items: center; gap: 14px;
  padding: 9px 14px 9px 9px; border: 0; border-radius: 18px; text-align: left;
  background: linear-gradient(120deg, rgb(var(--a) / .17), rgb(var(--a) / .04) 70%);
  transition: transform .25s var(--ease), background-color .4s;
}
.connect-btn:active { transform: scale(.985); }
.connect-btn.shake { animation: shake .45s var(--ease); }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.cb-orb {
  position: relative; width: 52px; height: 52px; flex: none; border-radius: 50%;
  display: grid; place-items: center; color: var(--on-a);
  background: radial-gradient(circle at 35% 28%, rgb(var(--a)), rgb(var(--a) / .7) 60%, rgb(var(--a) / .5));
  box-shadow: 0 10px 24px -8px rgb(var(--a) / calc(.85 * var(--glow-k))), inset 0 1px 0 rgba(255,255,255,.45);
  transition: background .4s, box-shadow .4s;
}
.cb-orb svg { width: 24px; height: 24px; position: relative; z-index: 1; }
.radar { position: absolute; inset: -7px; border-radius: 50%; opacity: 0; transition: opacity .35s var(--ease); pointer-events: none; }
.radar-sweep {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, rgb(var(--a) / 0) 0deg, rgb(var(--a) / 0) 220deg, rgb(var(--a) / .9) 360deg);
  -webkit-mask: radial-gradient(closest-side, transparent 78%, #000 80%, #000 99%, transparent 100%);
          mask: radial-gradient(closest-side, transparent 78%, #000 80%, #000 99%, transparent 100%);
}
.radar-wave { position: absolute; inset: 7px; border-radius: 50%; border: 1.5px solid rgb(var(--a) / .65); opacity: 0; }
.connect-btn[data-state="connecting"] .radar { opacity: 1; }
.connect-btn[data-state="connecting"] .radar-sweep { animation: spin 1.05s linear infinite; }
.connect-btn[data-state="connecting"] .radar-wave { animation: wave 1.7s var(--ease) infinite; }
.connect-btn[data-state="connecting"] .radar-wave.w2 { animation-delay: .85s; }
.connect-btn[data-state="connecting"] .cb-orb { background: radial-gradient(circle at 35% 28%, rgb(var(--a) / .55), rgb(var(--a) / .28)); box-shadow: none; color: var(--text); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes wave { from { transform: scale(1); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }
.connect-btn[data-state="connected"] { background: linear-gradient(120deg, rgb(var(--ok) / .14), rgb(var(--ok) / .03) 70%); }
.connect-btn[data-state="connected"] .cb-orb { background: radial-gradient(circle at 35% 28%, rgb(var(--ok)), rgb(var(--ok) / .7) 60%, rgb(var(--ok) / .5)); box-shadow: 0 10px 24px -8px rgb(var(--ok) / calc(.85 * var(--glow-k))), inset 0 1px 0 rgba(255,255,255,.45); }
.cb-flash { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgb(var(--ok)); opacity: 0; pointer-events: none; }
.cb-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.cb-text b { font-size: 16.5px; font-weight: 700; letter-spacing: -.2px; }
.cb-text small { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-go { color: var(--muted); opacity: .7; }
.connect-btn[data-state="connected"] .cb-go { transform: rotate(0); }

/* ---------- Cruceta 3D ---------- */
.pad-card { display: grid; place-items: center; padding: 6px 0 4px; }
.pad {
  position: relative; width: var(--pad); height: var(--pad);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  grid-template-areas: ". up ." "left stop right" ". down .";
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.pad::before {             /* disco base de vidrio con anillos concéntricos */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--plate);
  border: 1px solid var(--line);
  box-shadow: inset 0 2px 30px rgba(0,0,0,.18), 0 30px 60px -30px rgba(0,0,0,.5);
}
.pad::after {
  content: ""; position: absolute; inset: 17%; border-radius: 50%;
  border: 1px dashed var(--line); opacity: .8;
}
.pad-trail {               /* estela de luz hacia la dirección pulsada */
  position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(48% 48% at var(--tx, 50%) var(--ty, 50%), rgb(var(--a) / calc(.34 * var(--glow-k) + .06)), transparent 72%);
  opacity: 0; transition: opacity .5s var(--ease);
}
.pad[data-moving="1"] .pad-trail { opacity: 1; transition-duration: .15s; }
.pad[data-last="avanzar"]   .pad-trail { --tx: 50%; --ty: 6%; }
.pad[data-last="atras"]     .pad-trail { --tx: 50%; --ty: 94%; }
.pad[data-last="izquierda"] .pad-trail { --tx: 6%;  --ty: 50%; }
.pad[data-last="derecha"]   .pad-trail { --tx: 94%; --ty: 50%; }

.dbtn {
  position: relative; margin: 9%; padding: 0; border: 0; border-radius: 26px;
  align-self: stretch; justify-self: stretch;
  background: transparent; color: var(--key-text); touch-action: none;
}
.dbtn.up { grid-area: up; } .dbtn.down { grid-area: down; } .dbtn.left { grid-area: left; } .dbtn.right { grid-area: right; }
.dbtn::before {            /* lateral del botón: da el "grosor" físico */
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: var(--key-side); transform: translateY(6px);
  box-shadow: 0 14px 22px -10px rgba(0,0,0,.55);
}
.dbtn .face {
  position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
  display: grid; place-items: center; align-content: center; gap: 2px;
  background: linear-gradient(180deg, var(--key-top), var(--key-bot));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -10px 18px -12px rgba(0,0,0,.4);
  transition: transform .14s var(--ease);
}
.dbtn .face::after {       /* brillo de energía al pulsar */
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(85% 85% at 50% 35%, rgb(var(--a) / .5), transparent 72%);
  opacity: 0; transition: opacity .45s var(--ease);
}
.dbtn svg { width: 30px; height: 30px; stroke-width: 2.4; position: relative; z-index: 1; transition: color .2s; }
.dbtn small { position: relative; z-index: 1; font-size: 9.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; opacity: .55; }
.dbtn.is-pressed { color: rgb(var(--a)); }
.dbtn.is-pressed .face { transform: translateY(5px); box-shadow: inset 0 4px 12px rgba(0,0,0,.42), inset 0 0 0 1px rgb(var(--a) / .45); }
.dbtn.is-pressed .face::after { opacity: calc(.75 * var(--glow-k) + .25); transition-duration: .06s; }

.stop-btn {
  grid-area: stop; place-self: center; position: relative;
  width: 86%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; background: transparent;
  touch-action: none; color: #fff;
}
.stop-btn::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #6d0c19; transform: translateY(6px); box-shadow: 0 16px 26px -10px rgba(120, 10, 30, .6); }
.stop-btn::after {         /* aro exterior tipo seta de emergencia */
  content: ""; position: absolute; inset: -9%; border-radius: 50%;
  border: 1.5px solid rgb(var(--danger) / .35);
  box-shadow: 0 0 22px rgb(var(--danger) / calc(.28 * var(--glow-k)));
}
.stop-face {
  position: absolute; inset: 0; border-radius: 50%; z-index: 1;
  display: grid; place-items: center; align-content: center; gap: 1px;
  background: radial-gradient(circle at 50% 28%, #ff7884, #ec2440 52%, #b8122b);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.38), inset 0 -8px 14px rgba(0,0,0,.25);
  transition: transform .14s var(--ease);
}
.stop-face svg { width: 22px; height: 22px; stroke-width: 2.2; opacity: .9; }
.stop-face b { font-size: 11.5px; font-weight: 800; letter-spacing: .14em; }
.stop-btn.is-pressed .stop-face { transform: translateY(5px); box-shadow: inset 0 4px 12px rgba(0,0,0,.35); }
.stop-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgb(var(--danger)); opacity: 0; pointer-events: none; z-index: 0; }

/* ---------- Velocidad con arco ---------- */
.speed-card { display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; --spd: rgb(52 226 122); --p: 60%; }
.gauge { position: relative; width: 88px; height: 88px; flex: none; }
.gauge svg { width: 100%; height: 100%; overflow: visible; }
.g-track { fill: none; stroke: var(--faint-2); stroke-width: 8; stroke-linecap: round; }
.g-val {
  fill: none; stroke: var(--spd); stroke-width: 8; stroke-linecap: round;
  stroke-dasharray: 60 100;
  transition: stroke-dasharray .3s var(--ease), stroke .3s;
}
:root[data-theme="dark"] .g-val { filter: drop-shadow(0 0 5px var(--spd)); }
.gauge-read { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; padding-top: 4px; }
.gauge-read b { font-size: 26px; font-weight: 750; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
.gauge-read small { font-size: 9px; font-weight: 650; letter-spacing: .14em; color: var(--muted); margin-top: 3px; }
.speed-ctl { flex: 1; min-width: 0; }
.speed-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.speed-head span:first-child { font-size: 14.5px; font-weight: 650; }
.speed-tag { font: 600 10.5px var(--mono); letter-spacing: .06em; padding: 3px 8px; border-radius: 99px; color: var(--spd); background: var(--faint); border: 1px solid var(--line); transition: color .3s; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 0; background: transparent; cursor: pointer; }
.range::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--spd) 0 var(--p), var(--faint-2) var(--p) 100%); }
.range::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border-radius: 50%; border: 0;
  background: #fff; box-shadow: 0 0 0 3px var(--spd), 0 6px 14px rgba(0,0,0,.35);
  transition: transform .2s var(--ease);
}
.range:active::-webkit-slider-thumb { transform: scale(1.12); }
.range::-moz-range-track { height: 8px; border-radius: 8px; background: var(--faint-2); }
.range::-moz-range-progress { height: 8px; border-radius: 8px; background: var(--spd); }
.range::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 0 0 3px var(--spd), 0 6px 14px rgba(0,0,0,.35); }
.speed-scale { display: flex; justify-content: space-between; font: 500 10px var(--mono); color: var(--muted); opacity: .8; padding: 0 2px; }

/* ---------- Extras ---------- */
.extras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.xbtn {
  --tone: var(--a);
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 13px 6px 11px; border-radius: 20px;
  transition: transform .25s var(--ease), border-color .3s;
}
.xbtn:active { transform: scale(.955); }
.xbtn.lights { --tone: var(--amber); }
.xbtn.safety { --tone: var(--ok); }
.x-icon {
  position: relative; width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center; color: var(--muted);
  background: var(--faint); border: 1px solid var(--line);
  transition: color .3s, background-color .3s, border-color .3s, box-shadow .3s;
}
.x-icon svg { width: 22px; height: 22px; }
.x-wave { position: absolute; inset: -1px; border-radius: 14px; border: 1.5px solid rgb(var(--tone)); opacity: 0; pointer-events: none; }
.x-label { font-size: 13px; font-weight: 650; }
.x-state { font: 600 10px var(--mono); letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; background: var(--faint); color: var(--muted); transition: color .3s, background-color .3s; }
.xbtn[aria-pressed="true"] { border-color: rgb(var(--tone) / .35); }
.xbtn[aria-pressed="true"] .x-icon { color: rgb(var(--tone)); background: rgb(var(--tone) / .14); border-color: rgb(var(--tone) / .3); box-shadow: 0 0 22px rgb(var(--tone) / calc(.38 * var(--glow-k))); }
.xbtn[aria-pressed="true"] .x-state { color: rgb(var(--tone)); background: rgb(var(--tone) / .13); }
.xbtn.lights[aria-pressed="true"] .x-icon svg { animation: blinker 1s steps(1) infinite; }
@keyframes blinker { 50% { opacity: .35; } }
.xbtn.horn.honk .x-icon { color: rgb(var(--tone)); }

/* ---------- Telemetría (último comando) ---------- */
.telemetry {
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  padding: 2px 4px 4px; font-size: 11.5px; color: var(--muted);
}
.telemetry code { font: 600 11.5px var(--mono); color: var(--text); padding: 3px 8px; border-radius: 8px; background: var(--faint); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
.telemetry code[data-state="offline"] { color: var(--muted); }
.telemetry code[data-state="sent"]::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--ok)); box-shadow: 0 0 6px rgb(var(--ok)); }
.telemetry code[data-state="pending"]::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--warn)); }
.telemetry .sep { width: 1px; height: 14px; background: var(--line); }

/* ---------- Pantalla ancha (PC/proyector) y móvil en horizontal ---------- */
@media (min-width: 880px) {
  :root { --pad: min(380px, 52vh); }
  .app {
    max-width: 940px; display: grid; gap: 16px 22px; align-content: center;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "top top" "notice notice" "conn pad" "speed pad" "extras pad" "tele tele";
  }
  .topbar { grid-area: top; } .notice { grid-area: notice; } .connect-card { grid-area: conn; }
  .pad-card { grid-area: pad; } .speed-card { grid-area: speed; } .extras { grid-area: extras; } .telemetry { grid-area: tele; }
}
/* Móvil en vertical con poca altura: todo compacto para que quepa sin desplazar */
@media (orientation: portrait) and (max-height: 780px) {
  :root { --pad: min(78vw, 330px, 37dvh); }
  .app { gap: 10px; }
  .topbar { padding-top: 7px; padding-bottom: 7px; }
  .gauge { width: 76px; height: 76px; }
  .speed-card { padding-top: 9px; padding-bottom: 9px; }
  .xbtn { padding: 9px 6px 8px; gap: 5px; }
  .x-icon { width: 38px; height: 38px; }
}
/* Móvil en horizontal: cruceta a la izquierda (a toda altura) y el resto a la derecha */
@media (orientation: landscape) and (max-height: 560px) {
  :root { --pad: min(82dvh, 330px); }
  .app {
    max-width: 920px; display: grid; gap: 8px 24px; align-content: center;
    grid-template-columns: auto 1fr;
    grid-template-areas: "pad top" "pad notice" "pad conn" "pad speed" "pad extras";
    padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .topbar { grid-area: top; padding: 6px 8px; } .notice { grid-area: notice; } .connect-card { grid-area: conn; padding: 6px; }
  .pad-card { grid-area: pad; padding: 0; } .speed-card { grid-area: speed; padding: 6px 14px 6px 8px; } .extras { grid-area: extras; }
  .telemetry { display: none; }
  .brand-mark { width: 36px; height: 36px; }
  .cb-orb { width: 42px; height: 42px; }
  .gauge { width: 64px; height: 64px; } .gauge-read b { font-size: 20px; }
  .xbtn { padding: 7px 6px; gap: 3px; } .x-icon { width: 32px; height: 32px; border-radius: 11px; }
}

/* =====================================================================
   6. AVISOS (toasts) dentro de la estética
   ===================================================================== */
.toasts {
  position: fixed; z-index: 90; left: 50%; transform: translateX(-50%);
  top: max(10px, env(safe-area-inset-top));          /* sobre la cabecera: no tapa los controles */
  width: min(calc(100% - 24px), 420px);
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  --tone: var(--a);
  pointer-events: auto; display: flex; align-items: center; gap: 12px;
  padding: 11px 11px 11px 12px; border-radius: 18px;
  background: var(--glass-strong); border: 1px solid var(--glass-border);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
  opacity: 0; transform: translateY(-14px) scale(.97);
  transition: opacity .35s var(--ease), transform .55s var(--ease);
}
.toast.in { opacity: 1; transform: none; }
.toast.out { opacity: 0; transform: translateY(-10px) scale(.97); }
.toast.t-ok { --tone: var(--ok); } .toast.t-warn { --tone: var(--warn); } .toast.t-error { --tone: var(--danger); } .toast.t-info { --tone: var(--a); }
.toast-ic { width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center; color: rgb(var(--tone)); background: rgb(var(--tone) / .14); }
.toast-ic svg { width: 18px; height: 18px; }
.toast-body { flex: 1; min-width: 0; }
.toast-body b { display: block; font-size: 14px; font-weight: 650; }
.toast-body span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
.toast-act { flex: none; height: 34px; padding: 0 13px; border: 0; border-radius: 11px; font-size: 13px; font-weight: 650; color: var(--on-a); background: rgb(var(--a)); }

/* =====================================================================
   7. DIÁLOGO DE BIENVENIDA / AJUSTES
   ===================================================================== */
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: end center; padding: 16px 14px max(16px, env(safe-area-inset-bottom)); }
@media (min-width: 600px), (orientation: landscape) { .modal { place-items: center; } }
.modal-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .45s var(--ease); }
.sheet {
  position: relative; width: min(100%, 420px); max-height: calc(100dvh - 32px); overflow: auto;
  padding: 22px 20px 18px; border-radius: 28px; background: var(--glass-strong);
  opacity: 0; transform: translateY(28px) scale(.98);
  transition: opacity .4s var(--ease), transform .65s var(--ease);
}
.modal.on .modal-scrim { opacity: 1; }
.modal.on .sheet { opacity: 1; transform: none; }
.sheet-hero { display: flex; justify-content: center; margin: 2px 0 14px; }
.sheet-hero .brand-mark { width: 54px; height: 54px; border-radius: 17px; }
.sheet-hero .brand-mark svg { width: 34px; }
.sheet h2 { margin: 0; text-align: center; font-size: 21px; font-weight: 750; letter-spacing: -.4px; }
.sheet > p { margin: 6px auto 16px; max-width: 32ch; text-align: center; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.prefs { border-radius: 18px; background: var(--faint); border: 1px solid var(--line); padding: 4px 12px; margin-bottom: 16px; }
.pref-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.pref-row + .pref-row { border-top: 1px solid var(--line); }
.pref-row > span { font-size: 14px; font-weight: 600; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: var(--faint); border: 1px solid var(--line); min-width: 186px; }
.seg button { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px; border: 0; background: none; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); transition: color .3s; }
.seg button svg { width: 15px; height: 15px; }
.seg button[aria-checked="true"] { color: var(--text); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 9px; background: var(--seg-thumb); box-shadow: 0 2px 8px rgba(0,0,0,.18); transition: transform .45s var(--ease); }
.seg[data-v="light"] .seg-thumb { transform: translateX(100%); }
.swatches { display: flex; gap: 12px; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0; background: radial-gradient(circle at 35% 30%, rgb(var(--sw) / 1), rgb(var(--sw) / .7)); box-shadow: 0 0 0 0 transparent; transition: box-shadow .3s var(--ease), transform .3s var(--ease); }
.swatches button[aria-checked="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px rgb(var(--sw)); transform: scale(1.05); }
.switch { position: relative; width: 50px; height: 30px; border-radius: 99px; border: 0; padding: 0; background: var(--faint-2); transition: background-color .3s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .4s var(--ease); }
.switch[aria-checked="true"] { background: rgb(var(--a)); }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { height: 48px; border-radius: 15px; border: 1px solid transparent; font-size: 15px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .2s var(--ease), background-color .3s; }
.btn:active { transform: scale(.97); }
.btn.primary { color: var(--on-a); background: linear-gradient(180deg, rgb(var(--a)), rgb(var(--a) / .82)); box-shadow: 0 10px 24px -10px rgb(var(--a) / calc(.9 * var(--glow-k))), inset 0 1px 0 rgba(255,255,255,.35); }
.btn.ghost { color: var(--text); background: var(--faint); border-color: var(--line); }
.btn svg { width: 18px; height: 18px; }

/* =====================================================================
   8. GUÍA PASO A PASO (foco sobre la interfaz real)
   ===================================================================== */
.tour { position: fixed; inset: 0; z-index: 75; touch-action: none; }
.tour-hole {
  position: fixed; left: 0; top: 0; width: 100px; height: 100px; border-radius: 20px;
  box-shadow: 0 0 0 200vmax var(--scrim);
  transition: transform .5s var(--ease), width .5s var(--ease), height .5s var(--ease), border-radius .5s var(--ease), opacity .4s;
  pointer-events: none; opacity: 0;
}
.tour.on .tour-hole { opacity: 1; }
.tour-hole::after {
  content: ""; position: absolute; inset: -3px; border-radius: inherit;
  border: 2px solid rgb(var(--a));
  box-shadow: 0 0 22px rgb(var(--a) / calc(.55 * var(--glow-k))), inset 0 0 18px rgb(var(--a) / calc(.25 * var(--glow-k)));
  animation: tourPulse 1.8s var(--ease-io) infinite alternate;
}
@keyframes tourPulse { from { opacity: .55; } to { opacity: 1; } }
.tour-card {
  position: fixed; left: 0; top: 0; width: 340px; padding: 16px 16px 14px; border-radius: 22px;
  background: var(--glass-strong);
  transition: transform .5s var(--ease), opacity .3s var(--ease);
  opacity: 0;
}
.tour.on .tour-card { opacity: 1; }
.tour-card.swap .tour-inner { opacity: 0; transform: translateY(6px); }
.tour-inner { transition: opacity .25s var(--ease), transform .35s var(--ease); }
.tour-step { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: rgb(var(--a)); }
.tour-card h3 { margin: 5px 0 4px; font-size: 17px; font-weight: 750; letter-spacing: -.2px; }
.tour-card p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.tour-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.tour-dots { display: flex; gap: 5px; flex: 1; }
.tour-dots i { width: 6px; height: 6px; border-radius: 6px; background: var(--faint-2); transition: width .4s var(--ease), background-color .3s; }
.tour-dots i.on { width: 18px; background: rgb(var(--a)); }
.tour-foot .btn { height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }

/* =====================================================================
   9. MOVIMIENTO REDUCIDO (accesibilidad)
   ===================================================================== */
@media (prefers-reduced-motion: reduce) {
  .reveal { transition-duration: .3s; transition-delay: 0s; transform: none; }
  .radar-sweep, .radar-wave, .status-ic::after, .tour-hole::after { animation: none !important; }
}
